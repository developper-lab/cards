<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планировщик карточек</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">

        <section id="setupScreen" class="screen">
            <h1 class="title">📋 Планировщик карточек</h1>

            <div class="card">
                <h2 class="subtitle">Параметры</h2>

                <div class="fields">
                    <div class="field">
                        <label for="totalCards">Всего карточек за месяц</label>
                        <input type="number" id="totalCards" value="28000" min="1">
                    </div>
                    <div class="field">
                        <label for="daysInMonth">Дней в месяце</label>
                        <input type="number" id="daysInMonth" value="31" min="1" max="365">
                    </div>
                    <div class="field">
                        <label for="hoursPerDay">Часов работы в день</label>
                        <input type="number" id="hoursPerDay" value="8" min="1" max="24">
                    </div>
                    <div class="field">
                        <label for="timePerCard">Секунд на карточку (мин. 15)</label>
                        <input type="number" id="timePerCard" value="15" min="15">
                    </div>
                    <div class="field">
                        <label for="breakDuration">Перерыв (минут)</label>
                        <input type="number" id="breakDuration" value="10" min="1">
                    </div>
                    <div class="field">
                        <label for="lunchDuration">Обед (минут)</label>
                        <input type="number" id="lunchDuration" value="60" min="0">
                    </div>
                </div>

                <p class="note">
                    Норма пересчитывается автоматически. Если не успеваешь — остаток переносится на следующий день.
                </p>

                <div class="actions">
                    <button class="btn primary" onclick="startApp()">🚀 Начать</button>
                    <button class="btn secondary" onclick="resetProgress()">🔄 Сбросить прогресс</button>
                </div>
            </div>
        </section>

        <section id="workScreen" class="screen hidden">
            <h1 class="title">
                📋 День <span id="dayNumber">1</span> из <span id="dayTotal">31</span>
            </h1>

            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="statNorm">0</div>
                    <div class="stat-label">Норма на день</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statDone">0</div>
                    <div class="stat-label">Сделано</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statLeft">0</div>
                    <div class="stat-label">Осталось</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statPerHour">0</div>
                    <div class="stat-label">В час</div>
                </div>
            </div>

            <div class="card">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="card">
                <p class="status" id="statusText">Готов к работе</p>
                <div class="timer" id="timer">00:00</div>

                <div class="actions">
                    <button id="btnStart" class="btn primary" onclick="startWork()">▶ Старт</button>
                    <button id="btnPause" class="btn secondary hidden" onclick="pauseWork()">⏸ Пауза</button>
                    <button id="btnSkip" class="btn secondary hidden" onclick="skipBreak()">⏩ Пропустить
                        перерыв</button>
                    <button id="btnEndDay" class="btn danger" onclick="endDay()">🏁 Завершить день</button>
                </div>
            </div>

            <div class="card">
                <h2 class="subtitle">Расписание на день</h2>
                <div id="scheduleList" class="schedule"></div>
            </div>

            <div class="card">
                <div class="actions">
                    <button class="btn secondary" onclick="backToSettings()">← Назад к настройкам</button>
                </div>
            </div>
        </section>

    </div>

    <script src="app.js"></script>
</body>

</html>
